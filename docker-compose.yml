# antiaimark (Go) — production-ish local deployment.
#
#   docker compose up -d          # build + start on 127.0.0.1:8765
#
# All knobs come from the environment (or a Compose-style .env file next to
# this one); defaults mirror the bare-metal defaults.

services:
  antiaimark:
    build: .
    image: antiaimark:latest
    container_name: antiaimark
    restart: unless-stopped
    # Loopback-only by default; change the host side for trusted networks.
    ports:
      - "${ANTIAIMARK_BIND:-127.0.0.1}:${ANTIAIMARK_PORT:-8765}:8765"
    environment:
      ANTIAIMARK_SERVER_VERSION: "${ANTIAIMARK_SERVER_VERSION:-docker}"
      ANTIAIMARK_SERVER_API_KEY: "${ANTIAIMARK_SERVER_API_KEY:-}"
      ANTIAIMARK_SERVER_HOST: "0.0.0.0"
      ANTIAIMARK_SERVER_PORT: "8765"
      ANTIAIMARK_LANG: "${ANTIAIMARK_LANG:-}"
      ANTIAIMARK_AUTO_CLEAN: "${ANTIAIMARK_AUTO_CLEAN:-0}"
      ANTIAIMARK_AUTO_CLEAN_INTERVAL: "${ANTIAIMARK_AUTO_CLEAN_INTERVAL:-15m}"
      ANTIAIMARK_AUTO_CLEAN_THRESHOLD: "${ANTIAIMARK_AUTO_CLEAN_THRESHOLD:-11}"
      ANTIAIMARK_AUTO_CLEAN_TTL: "${ANTIAIMARK_AUTO_CLEAN_TTL:-24h}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
