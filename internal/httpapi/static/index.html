<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>watermarks-remover web</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --border:#2a2f3a; --fg:#e6e9ef; --muted:#9aa3b2; --accent:#4f8cff; --good:#3ecf6e; --warn:#ffb454; --bad:#ff5f6d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .badge { font-size:12px; color:var(--muted); flex:1; }
  header select { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; }
  main { max-width:960px; margin:24px auto; padding:0 20px; }
  .drop { border:2px dashed var(--border); border-radius:12px; padding:48px 20px; text-align:center; cursor:pointer; transition:border-color .15s; background:var(--panel); }
  .drop:hover, .drop.drag { border-color: var(--accent); }
  .drop p { margin:8px 0 0; color:var(--muted); font-size:14px; }
  .drop .big { font-size:16px; color:var(--fg); }
  .opts { display:flex; flex-wrap:wrap; gap:16px; margin:16px 0; color:var(--muted); font-size:14px; }
  .opts label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .row { display:flex; gap:20px; flex-wrap:wrap; margin-top:20px; }
  .col { flex:1 1 420px; min-width:320px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h3 { margin:0 0 12px; font-size:15px; }
  pre { background:#0d0f13; border:1px solid var(--border); border-radius:8px; padding:12px; overflow:auto; max-height:360px; font-size:12px; line-height:1.5; color:var(--fg); white-space:pre-wrap; word-break:break-word; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; margin-left:8px; }
  .pill.ok { background:rgba(62,207,110,.15); color:var(--good); }
  .pill.bad { background:rgba(255,95,109,.15); color:var(--bad); }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.secondary { background:var(--border); color:var(--fg); }
  .meta { font-size:13px; color:var(--muted); margin:8px 0 0; }
  #preview { max-width:100%; max-height:300px; border-radius:8px; border:1px solid var(--border); margin-top:10px; }
  .actions { display:flex; gap:10px; align-items:center; margin-top:12px; }
  .err { color:var(--bad); font-size:14px; margin-top:12px; }
  .status { color:var(--muted); font-size:13px; margin-top:12px; }
  .finding { padding:3px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .finding:last-child { border-bottom:none; }
  .conf { font-size:11px; border-radius:4px; padding:1px 6px; margin-right:6px; }
  .conf.confirmed { background:rgba(255,95,109,.2); color:var(--bad); }
  .conf.probable { background:rgba(255,180,84,.2); color:var(--warn); }
  .conf.informational { background:rgba(154,163,178,.2); color:var(--muted); }
  .conf.likely_false_positive { background:rgba(154,163,178,.2); color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>watermarks-remover</h1>
  <span class="badge" id="version"></span>
  <label for="lang" id="langLabel" style="font-size:13px;color:var(--muted)"></label>
  <select id="lang"></select>
</header>
<main>
  <div class="drop" id="drop">
    <div class="big" data-i18n="web.drop_big"></div>
    <p data-i18n="web.drop_hint"></p>
  </div>
  <input type="file" id="file" hidden>
  <div class="opts">
    <label><input type="checkbox" id="opt-nfkc"> <span data-i18n="web.opt_nfkc"></span></label>
    <label><input type="checkbox" id="opt-aggr"> <span data-i18n="web.opt_aggressive"></span></label>
    <label><input type="checkbox" id="opt-layer-a" checked> <span data-i18n="web.opt_layer_a"></span></label>
    <label><input type="checkbox" id="opt-strip-all" checked> <span data-i18n="web.opt_strip_all"></span></label>
    <label><span data-i18n="web.opt_pixel"></span> <select id="opt-pixel"><option value="" data-i18n="web.opt_pixel_off"></option><option value="ctrlregen">CtrlRegen</option><option value="diffusion">MarkDiffusion</option></select></label>
  </div>
  <div class="actions">
    <button class="btn" id="run" disabled data-i18n="web.run"></button>
    <a class="btn secondary" id="download" hidden data-i18n="web.download"></a>
  </div>
  <div class="status" id="status"></div>
  <div class="err" id="error"></div>

  <div class="row">
    <div class="col">
      <div class="panel" id="inspectPanel" hidden>
        <h3><span data-i18n="web.inspect_title"></span> <span id="inspectPill" class="pill"></span></h3>
        <div id="inspectList"></div>
        <pre id="inspectJson" hidden></pre>
      </div>
    </div>
    <div class="col">
      <div class="panel" id="cleanPanel" hidden>
        <h3><span data-i18n="web.clean_title"></span> <span id="cleanPill" class="pill"></span></h3>
        <pre id="cleanJson"></pre>
      </div>
    </div>
  </div>
  <img id="preview" alt="" hidden>
  <video id="previewVideo" hidden controls></video>
</main>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file');
let selectedFile = null, downloadToken = null, originalName = null;
let I18N = {};   // key -> message for the active language
let LANG = 'en';

// minimal fmt-style substitution: %s %d %v %.1f %.3f in order
function tr(key, ...args) {
  let s = I18N[key] !== undefined ? I18N[key] : key;
  let i = 0;
  s = s.replace(/%\.?\d*[sdfv]/g, m => i < args.length ? String(args[i++]) : m);
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  $('langLabel').textContent = tr('web.language');
  document.title = tr('web.title');
  if ($('run').textContent !== tr('web.run') && $('run').disabled === false) $('run').textContent = tr('web.run');
}

function buildLangPicker(languages) {
  const sel = $('lang');
  sel.innerHTML = '';
  languages.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.tag; opt.textContent = l.name;
    if (l.tag === LANG) opt.selected = true;
    sel.appendChild(opt);
  });
}

async function setLang(lang) {
  LANG = lang;
  try {
    const res = await fetch('/api/i18n?lang=' + encodeURIComponent(lang));
    const body = await res.json();
    I18N = body.messages || {};
    buildLangPicker(body.languages || []);
    applyI18n();
  } catch (e) { /* keep previous catalog */ }
}

$('lang').addEventListener('change', e => {
  localStorage.setItem('wm-lang', e.target.value);
  setLang(e.target.value);
});

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag'); if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });

function selectFile(f) {
  selectedFile = f; originalName = f.name; downloadToken = null;
  $('download').hidden = true;
  $('inspectPanel').hidden = true; $('cleanPanel').hidden = true;
  $('error').textContent = ''; $('status').textContent = tr('web.selected', f.name, (f.size/1024).toFixed(1));
  $('run').disabled = false;
  $('preview').hidden = true; $('previewVideo').hidden = true;
  if (f.type.startsWith('image/')) {
    $('preview').src = URL.createObjectURL(f); $('preview').hidden = false;
  } else if (f.type.startsWith('video/')) {
    $('previewVideo').src = URL.createObjectURL(f); $('previewVideo').hidden = false;
  }
}

$('run').addEventListener('click', async () => {
  if (!selectedFile) return;
  const btn = $('run'); btn.disabled = true; btn.textContent = tr('web.running');
  $('error').textContent = ''; $('status').textContent = tr('web.uploading');
  const fd = new FormData();
  fd.append('file', selectedFile);
  const opts = {};
  if ($('opt-nfkc').checked) opts.nfkc = true;
  if ($('opt-aggr').checked) opts.aggressive_homoglyphs = true;
  if (!$('opt-layer-a').checked) opts.also_layer_a_text = false;
  if (!$('opt-strip-all').checked) opts.keep_non_ai_metadata = true;
  const px = $('opt-pixel').value;
  if (px) opts.remove_pixel = px;
  fd.append('options', JSON.stringify(opts));
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error || ('HTTP ' + res.status));
    downloadToken = body.download_token;
    renderResults(body);
  } catch (e) {
    $('error').textContent = tr('web.failed', e.message);
  } finally {
    btn.disabled = false; btn.textContent = tr('web.run');
  }
});

function renderResults(body) {
  $('status').textContent = tr('web.done', body.name, body.kind, body.bytes_in, body.bytes_out);
  const insp = $('inspectPanel'), pill = $('inspectPill');
  insp.hidden = false;
  pill.className = 'pill ' + (body.suspicious ? 'bad' : 'ok');
  pill.textContent = body.suspicious ? tr('web.suspicious') : tr('web.clean');
  const list = $('inspectList'); list.innerHTML = '';
  const report = body.report || {};
  const hits = report.hits || report.findings || [];
  if (!hits.length) list.innerHTML = '<div class="meta">' + tr('web.no_findings') + '</div>';
  hits.forEach(h => {
    const div = document.createElement('div'); div.className = 'finding';
    const c = document.createElement('span'); c.className = 'conf ' + (h.confidence || 'informational'); c.textContent = h.confidence || '';
    div.appendChild(c);
    div.appendChild(document.createTextNode(String(h.label || h)));
    list.appendChild(div);
  });
  $('inspectJson').hidden = true;
  $('cleanPanel').hidden = false;
  $('cleanJson').textContent = JSON.stringify(body.clean_report || {}, null, 2);
  const dl = $('download');
  dl.hidden = false;
  dl.href = '/api/download/' + downloadToken;
  dl.setAttribute('download', 'cleaned-' + originalName);
}

// boot: saved language > browser language > server default
(async () => {
  const saved = localStorage.getItem('wm-lang');
  const nav = (navigator.language || 'en').split('-')[0];
  await setLang(saved || nav);
  fetch('/capabilities').then(r => r.json()).then(c => {
    const t = c.tools || {};
    const present = ['c2patool','exiftool','qpdf'].filter(k => t[k]);
    $('version').textContent = 'v' + c.version + ' · ' + tr('web.tools') + ': ' + (present.join(', ') || tr('web.none'));
  }).catch(() => { $('version').textContent = tr('web.unreachable'); });
})();
</script>
</body>
</html>
