name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Validate Claude plugin marketplace
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: npx -y @anthropic-ai/claude-code plugin validate .

      - name: Cross-compile (linux/darwin/freebsd incl. janitor disk-free)
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in linux/amd64 linux/arm64 linux/386 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

      - name: HTTP + MCP smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go build -o /tmp/antiaimark-server ./cmd/antiaimark-server
          /tmp/antiaimark-server --port 18765 &
          sleep 1
          # JSON endpoints (indented JSON: note the space after the colon)
          curl -fsS http://127.0.0.1:18765/health | grep '"ok"'
          curl -fsS "http://127.0.0.1:18765/api/i18n?lang=zh" | grep '"lang": "zh"'
          # MCP over stdio (compact single-line JSON)
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"locale":"zh-CN"}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' \
            | go run ./cmd/antiaimark-mcp | head -2 | grep -c '"name":"capabilities"'
          # MCP over Streamable HTTP (session handshake + tools/list)
          sid=$(curl -fsS -X POST http://127.0.0.1:18765/mcp \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"locale":"zh-CN"}}' \
            -D - -o /dev/null | tr -d '\r' | awk -F': ' '/^Mcp-Session-Id/{print $2; exit}')
          test -n "$sid"
          curl -fsS -X POST http://127.0.0.1:18765/mcp \
            -H "Accept: application/json" -H "Mcp-Session-Id: $sid" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | grep -c '"name":"capabilities"'
